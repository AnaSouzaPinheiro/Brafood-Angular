<div class="content">
  <div class="result">
    <div class="infos">
      <h1>
        Resultados da pesquisa: <span class="name">{{ nomePesquisado }}</span>
      </h1>
      <span>
        Encontrado:
        <span class="qtd">{{ Recipes.length }} </span> receitas</span
      >
    </div>

    <div class="filter-container">
      <div class="filters">
        <bra-filter-dropdown
          [optionsDropwdown]="optionsDropwdown"
          type="single"
          (changeFilter)="filtrarPorOrdem($event)"
        ></bra-filter-dropdown>

        <bra-filter-dropdown
          [optionsDropwdown]="optionsDropwdown2"
          type="multi"
          (changeMulti)="filtrarPorCategoria($event)"
        ></bra-filter-dropdown>

        <bra-custom-button
          [label]="'Limpar filtros'"
          [type]="'filter'"
          (click)="limparFiltros()"
        ></bra-custom-button>
      </div>
    </div>
  </div>
  <div class="cards">
    @for (recipe of RecipesPage; track $index) {
    <bra-recipe-card
      [recipe]="recipe"
    ></bra-recipe-card>
    }
  </div>
  <div class="pages">
    <bra-custom-button
      [hidden]="RecipesFiltradas.length  < end"
      [label]="'Ver mais receitas'"
      [type]="'comment'"
      (click)="verMais()"
    ></bra-custom-button>
  </div>
</div>
