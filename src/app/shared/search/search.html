<div class="content">
  <div class="result">
    <div class="infos">
      <h1>
        Resultados da pesquisa: <span class="name">{{ nomePesquisado }}</span>
      </h1>
      <span>
        Encontrado:
        <span class="qtd" *ngIf="!loadingSearch">{{ RecipesFiltradas.length }}</span
        ><span class="qtd" *ngIf="loadingSearch">...</span> receitas
      </span>
    </div>

    <div class="filter-container" *ngIf="!loadingSearch">
      <bra-filter-panel
        mode="categoria"
        [dropdownDinamico]="categoriaItems"
        [labelDinamico]="'Categorias:'"
        [totalReceitas]="RecipesFiltradas.length"
        [showContadorMobile]="false"
        (filtrosChange)="onFiltrosChange($event)"
      ></bra-filter-panel>
    </div>
  </div>

  <!-- SKELETON enquanto os resultados carregam -->
  <bra-recipe-card-skeleton
    *ngIf="loadingSearch"
    [count]="8"
  ></bra-recipe-card-skeleton>

  <ng-container *ngIf="!loadingSearch">
    <div class="cards">
      @for (recipe of RecipesPage; track $index) {
      <bra-recipe-card [recipe]="recipe"></bra-recipe-card>
      }
    </div>

    <div class="pages">
      <bra-custom-button
        [hidden]="RecipesFiltradas.length < end"
        [label]="'Ver mais receitas'"
        [type]="'comment'"
        (click)="verMais()"
      ></bra-custom-button>
    </div>
  </ng-container>
</div>
