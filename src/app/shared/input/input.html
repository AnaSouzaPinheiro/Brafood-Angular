<div class="textbox">
  <label [for]="inputId">{{ label }}</label>

  <ng-container *ngIf="inType === 'input'; else textareaTpl">
    <input
      [id]="inputId"
      [name]="name"
      [type]="type"
      [placeholder]="placeholder"
      class="input-text"
      [value]="value"
      (input)="onInput($event)"
      [attr.autocomplete]="autocomplete"
    />
  </ng-container>

  <ng-template #textareaTpl>
    <textarea
      [id]="inputId"
      [name]="name"
      class="input-text textarea"
      [placeholder]="placeholder"
      [value]="value"
      (input)="onInput($event)"
      [attr.autocomplete]="autocomplete"
    ></textarea>
  </ng-template>
</div>
