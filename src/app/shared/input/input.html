<div class="textbox">
  <label [for]="inputId">{{ label }}</label>

  <ng-container *ngIf="inType === 'input'; else textareaTpl">
    <input
      [id]="inputId"
      [name]="name"
      [type]="type"
      [placeholder]="placeholder"
      class="input-text"
      [class.input-error]="isInvalid"
      [value]="value"
      (input)="onInput($event)"
      (blur)="onBlur()"
      [attr.autocomplete]="autocomplete"
      [attr.maxlength]="maxChars ?? null"
    />
  </ng-container>

  <ng-template #textareaTpl>
    <textarea
      #campoTexto
      [class.auto-grow]="autoGrow"
      [id]="inputId"
      [name]="name"
      class="input-text textarea"
      [class.input-error]="isInvalid"
      [placeholder]="placeholder"
      [value]="value"
      (input)="onInput($event)"
      (blur)="onBlur()"
      [attr.autocomplete]="autocomplete"
      [attr.maxlength]="maxChars ?? null"
    ></textarea>
  </ng-template>

  <span
    *ngIf="maxChars"
    class="char-counter"
    [class.near-limit]="nearLimit"
    [class.over-limit]="overLimit"
    aria-live="polite"
  >
    {{ charCount }}/{{ maxChars }}
  </span>

  <span class="field-error" *ngIf="isInvalid" role="alert">
    <i class="fa-solid fa-circle-exclamation"></i>
    {{ errorMessage }}
  </span>
</div>
