<div class="overlay" *ngIf="modal">
  <div class="modal">
    <i class="fa-solid" [ngClass]="getIcon()"></i>

    <h2>{{ modal.title }}</h2>
    <p>{{ modal.message }}</p>

    <div class="actions">
      <button *ngIf="modal.type === 'confirm'" class="cancel" (click)="close()">
        {{ modal.cancelText || 'Cancelar' }}
      </button>

      <button class="confirm" (click)="confirm()">
        {{ modal.confirmText || 'OK' }}
      </button>
    </div>
  </div>
</div>
