<div class="legal-container">
  <article class="legal-content">
    
    <h1>{{ title }}</h1>

    <p class="intro">
      {{ intro }}
    </p>

    <section *ngFor="let section of sections">
      <h2>{{ section.title }}</h2>
      <p class="texto">{{ section.content }}</p>
    </section>

  </article>
</div>
