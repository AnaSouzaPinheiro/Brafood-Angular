<div class="cont">
  <section
    class="container"
    [ngStyle]="section.urlSection
      ? { 'background-image': 'url(' + section.urlSection + ')' }
      : section.corFundo
        ? { 'background-color': section.corFundo, 'background-image': 'none' }
        : { 'background-image': 'none' }"
  >
    <div class="titulo">
      <div class="header">
        <button class="arrow" *ngIf="showLeftArrow" (click)="scrollLeft()">
          <
        </button>

        <h1 class="title">{{ section.title }}</h1>

        <button class="arrow" *ngIf="showRightArrow" (click)="scrollRight()">
          >
        </button>
      </div>

      <img [src]="section.fundoTitle | mediaUrl" class="fundoTitle" />
    </div>

    <div
      class="main"
      #slider
      (scroll)="checkArrows()"
      (mousedown)="startDrag($event)"
      (mousemove)="onDrag($event)"
      (mouseup)="stopDrag()"
      (mouseleave)="stopDrag()"
    >
      <div class="content">
        @for (recipe of section.recipes; track recipe.id ?? $index) {
        <bra-recipe-card [myRecipe]="false" [recipe]="recipe"></bra-recipe-card>
        }
      </div>
    </div>
  </section>
</div>
