<div class="cont">
  <section
    class="container"
    [ngStyle]="section.urlSection
      ? { 'background-image': 'url(' + section.urlSection + ')' }
      : section.corFundo
        ? { 'background-color': section.corFundo, 'background-image': 'none' }
        : { 'background-image': 'none' }"
  >
    <div class="titulo">
      <div class="header">
        <h2 class="title" [ngStyle]="getTituloStyle()">{{ section.title }}</h2>
      </div>

      <img [src]="section.fundoTitle | mediaUrl" class="fundoTitle" alt="" />
    </div>

    <div class="slider-wrap">
    <!-- Setas laterais: aparecem ao passar o mouse sobre a seção -->
    <button
      type="button"
      class="nav-arrow nav-arrow--left"
      [class.hidden]="!showLeftArrow"
      aria-label="Receitas anteriores"
      (click)="scrollLeft()"
    >
      <i class="fa-solid fa-circle-chevron-left"></i>
    </button>

    <div
      class="main"
      #slider
      (scroll)="checkArrows()"
      (mousedown)="startDrag($event)"
      (mousemove)="onDrag($event)"
      (mouseup)="stopDrag()"
      (mouseleave)="stopDrag()"
    >
      <div class="content">
        @for (recipe of section.recipes; track recipe.id ?? $index) {
        <bra-recipe-card
          [myRecipe]="false"
          [recipe]="recipe"
          [cardExibir]="section.cardExibir ?? 'categoria'"
        ></bra-recipe-card>
        }
      </div>
    </div>

    <button
      type="button"
      class="nav-arrow nav-arrow--right"
      [class.hidden]="!showRightArrow"
      aria-label="Próximas receitas"
      (click)="scrollRight()"
    >
      <i class="fa-solid fa-circle-chevron-right"></i>
    </button>
    </div>
  </section>
</div>
