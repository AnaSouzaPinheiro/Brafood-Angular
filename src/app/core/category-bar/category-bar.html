<div
  class="category-bar"
  [class.is-carousel]="isDesktop"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
>
  @if (isDesktop) {
    <button
      type="button"
      class="nav-arrow nav-arrow--left"
      aria-label="Categorias anteriores"
      (click)="scrollStep(-1)"
    >
      <i class="fa-solid fa-circle-chevron-left"></i>
    </button>
  }

  <ul #track [class.dragging]="isDragging" (pointerdown)="onPointerDown($event)">
    <li
      *ngFor="let categoria of categorias"
      [style.background-color]="categoria.cor_primaria || '#8BACFF'"
      (mouseenter)="onHover($event, categoria)"
      (mouseleave)="onLeave($event, categoria)"
    >
      <a [routerLink]="categoria.url" draggable="false">
        <img class="icon"
          draggable="false"
          [src]="categoria.icone"
          alt="{{ categoria.nome }} ícone"
        />
        {{ categoria.nome }}
      </a>
    </li>
    <!-- Duplicata só pro loop infinito no carrossel do desktop; some do
         DOM em telas pequenas via CSS e é ignorada por leitores de tela. -->
    <li
      *ngFor="let categoria of categorias"
      aria-hidden="true"
      tabindex="-1"
      class="clone"
      [style.background-color]="categoria.cor_primaria || '#8BACFF'"
      (mouseenter)="onHover($event, categoria)"
      (mouseleave)="onLeave($event, categoria)"
    >
      <a [routerLink]="categoria.url" draggable="false" tabindex="-1">
        <img class="icon"
          draggable="false"
          [src]="categoria.icone"
          alt=""
        />
        {{ categoria.nome }}
      </a>
    </li>
  </ul>

  @if (isDesktop) {
    <button
      type="button"
      class="nav-arrow nav-arrow--right"
      aria-label="Próximas categorias"
      (click)="scrollStep(1)"
    >
      <i class="fa-solid fa-circle-chevron-right"></i>
    </button>
  }
</div>
