<div class="modal">
  <ng-container *ngIf="loggedOut; else loggedIn">
    <ul>
      <li class="enter" [routerLink]="'/login'">Entrar</li>
      <hr />
      <li class="register" [routerLink]="'/cadastro'">Cadastrar</li>
    </ul>
  </ng-container>

  <ng-template #loggedIn>
    <div class="user">
      <ul>
        <li class="name">Olá, {{ modalLogged?.personName }}!</li>

        <a [routerLink]="modalLogged?.myAccount" class="click">
          <li>Minha conta</li>
        </a>

        <a [routerLink]="modalLogged?.myRecipes" class="click">
          <li>Minhas Receitas</li>
        </a>

        <a [routerLink]="modalLogged?.favs" class="click">
          <li>Favoritas</li>
        </a>

        <li class="logOut" (click)="logout()">
          <img src="assets/imagens/icones/sair-do-usuario (1).png" alt="" />
          Sair
        </li>
      </ul>
    </div>
  </ng-template>
</div>
