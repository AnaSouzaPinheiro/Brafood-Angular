<div class="cookie-banner" *ngIf="loaded() && !accepted()">
  <h3>Aviso de Cookies</h3>

  <p>
    Usamos cookies para melhorar sua experiência. Ao continuar navegando, você
    concorda com nossa política de privacidade.
  </p>

  <div class="actions">
    <button class="accept" (click)="accept()">Aceitar</button>

    <button class="more" [routerLink]="'/cookies'">Saiba mais</button>
  </div>
</div>
