<header>
  <a [routerLink]="'/home'">
    <img
      class="logo-area"
      src="assets/imagens/icones/BraFoodLogo-78.png"
      srcset="assets/imagens/icones/BraFoodLogo-78.png 1x, assets/imagens/icones/BraFoodLogo-156.png 2x, assets/imagens/icones/BraFoodLogo-234.png 3x"
      alt="Logo BraFood"
      width="78"
      height="58"
    />
  </a>

  <bra-search-bar class="search-area"></bra-search-bar>

  <div class="user-area">
    <button
      type="button"
      class="user-name"
      [attr.aria-expanded]="openModal()"
      (click)="togglePopup($event)"
    >
      {{ displayName() }}
    </button>

    <bra-user-icon
      class="icon-area"
      [userSignal]="user"
      (clickIcon)="togglePopup($event)"
    ></bra-user-icon>
  </div>

  @if (openModal()) {
  <bra-modal-log
    [modalLogged]="modalData"
    [loggedOut]="!logado()"
    [logout]="logout.bind(this)"
    class="profile-container"
    (click)="onMenuClick($event)"
  ></bra-modal-log>
  }
</header>
