<header>
  <a [routerLink]="'/home'">
    <img
      class="logo-area"
      src="assets/imagens/icones/BraFoodLogoR.png"
      alt="Logo BraFood"
    />
  </a>

  <bra-search-bar class="search-area"></bra-search-bar>

  <bra-user-icon
    class="icon-area"
    [userSignal]="user"
    (clickIcon)="togglePopup($event)"
  ></bra-user-icon>

  @if (openModal()) {
  <bra-modal-log
    [modalLogged]="modalData"
    [loggedOut]="!logado"
    [logout]="logout.bind(this)"
    class="profile-container"
  ></bra-modal-log>
  }
</header>
