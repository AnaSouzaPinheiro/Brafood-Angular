@if (logado()) {
  <nav class="profile-tabs" aria-label="Navegação do perfil">
    <div class="tabs">
      <a
        class="tab"
        routerLink="/perfil/editar"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <i class="fa-solid fa-pen-to-square"></i> Editar perfil
      </a>
      <a
        class="tab"
        routerLink="/perfil/receitas"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <i class="fa-solid fa-utensils"></i> Minhas receitas
      </a>
      <a
        class="tab"
        routerLink="/perfil/favoritas"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <i class="fa-solid fa-heart"></i> Favoritas
      </a>
    </div>

    @if (apelido()) {
    <a class="public-link" [routerLink]="['/chef', apelido()]">
      Ver meu perfil <i class="fa-solid fa-arrow-up-right-from-square"></i>
    </a>
    }
  </nav>
}
