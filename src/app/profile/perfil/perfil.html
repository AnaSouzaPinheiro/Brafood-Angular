<div class="menuPerfil">
  <bra-profile-header-skeleton *ngIf="loadingUser"></bra-profile-header-skeleton>

  <div class="main" *ngIf="!loadingUser">
    <div class="account">
      <bra-user-icon [userSignal]="user"></bra-user-icon>
      <h1 class="name">{{ user()?.nome }} {{ user()?.sobrenome }} </h1>
    </div>
    <div class="resume">
      <h2 class="title">Resume</h2>
      <p class="text">{{ user()?.bio }}</p>
    </div>
  </div>
  <div class="options">
    <bra-custom-button
      [label]="'Editar perfil'"
      [type]="'other'"
      [routerLink]="'/editar-perfil/' + userId"
      [active]="isEditarPerfil"
    ></bra-custom-button>

    <bra-custom-button
      [label]="'Minhas receitas'"
      [type]="'other'"
      [routerLink]="'/minhas-receitas/' + userId"
      [active]="isMinhasReceitas"
    ></bra-custom-button>

    <bra-custom-button
      [label]="'Favoritas'"
      [type]="'other'"
      [routerLink]="'/favoritas/' + userId"
      [active]="isFavoritas"
    ></bra-custom-button>
  </div>
  <hr />
</div>
