<div class="menuPerfil">
  <div class="main">
    <div class="account">
      <bra-user-icon [user]="user"></bra-user-icon>
      <h1 class="name">{{ user?.nome }} {{ user?.sobrenome }}</h1>
    </div>
    <div class="resume">
      <h2 class="title">Resume</h2>
      <p class="text">{{ user?.bio }}</p>
    </div>
  </div>
  <div class="options">
    <a [routerLink]="'/editar-perfil'" class="url">
      <bra-custom-button
        [label]="'Editar perfil'"
        [type]="'other'"
        [route]="'/editar-perfil'"
      ></bra-custom-button>
    </a>

    <a [routerLink]="'/minhas-receitas'" class="url">
      <bra-custom-button
        [label]="'Minhas receitas'"
        [type]="'other'"
        [route]="'/minhas-receitas'"
      ></bra-custom-button>
    </a>
  </div>
  <hr />
</div>
