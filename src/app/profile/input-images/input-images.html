<div class="container-fotos">
  <div class="first-image">
    <label class="picture" for="picture_input_capa">
      <input
        id="picture_input_capa"
        type="file"
        accept="image/png, image/jpg"
        class="picture_input"
        (change)="onCapaChange($event)"
      />
      <div class="infos">
        <ng-container *ngIf="!hasPreview(previewCapa); else showPreviewCapa">
          <img
            class="picture_image"
            src="assets/imagens/icones/foto.png"
            alt=""
          />
          <p>Formato: jpg ou png</p>
          <p>Dimensões ideais em pixels: 920 x 600</p>
          <p>Peso: até 3mb cada</p>
        </ng-container>
        <ng-template #showPreviewCapa>
          <img
            class="picture__img"
            [src]="previewCapa | mediaUrl"
            alt="Imagem de capa selecionada"
          />
        </ng-template>
      </div>
    </label>
  </div>

  <div class="others">
    <div class="gallery-grid">
      <!-- modo edição -->
      <div class="gallery-thumb" *ngFor="let img of galeriaExistente; let i = index">
        <img [src]="img | mediaUrl" alt="Imagem da galeria" />
        <button
          type="button"
          class="remove-btn"
          (click)="removerExistente(i)"
          title="Remover imagem"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Imagens novas selecionadas nesta sessão -->
      <div class="gallery-thumb" *ngFor="let preview of galeriaNovosPreviews; let i = index">
        <img [src]="preview" alt="Nova imagem selecionada" />
        <button
          type="button"
          class="remove-btn"
          (click)="removerNova(i)"
          title="Remover imagem"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Botão de adicionar mais imagens -->
      <label class="gallery-thumb gallery-add" *ngIf="podeAdicionarMais" for="picture_input_galeria">
        <input
          id="picture_input_galeria"
          type="file"
          accept="image/png, image/jpg"
          class="picture_input"
          multiple
          (change)="onGaleriaFilesSelected($event)"
        />
        <i class="fa-solid fa-plus"></i>
        <span>Adicionar fotos</span>
      </label>
    </div>
  </div>
</div>
