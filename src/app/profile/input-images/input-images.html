<div class="container-fotos">
  <div class="first-image">
    <label class="picture" for="picture_input1">
      <input
        id="picture_input1"
        type="file"
        accept="image/png, image/jpg"
        class="picture_input"
        (change)="onFileChange($event, 1)"
      />
      <div class="infos">
        <ng-container *ngIf="!hasPreview(previewSrc1); else showPreview1">
          <img
            class="picture_image"
            src="assets/imagens/icones/foto.png"
            alt=""
          />
          <p>Formato: jpg ou png</p>
          <p>Dimensões ideais em pixels: 920 x 600</p>
          <p>Peso: até 3mb cada</p>
        </ng-container>
        <ng-template #showPreview1>
          <img
            class="picture__img"
            [src]="previewSrc1"
            alt="Imagem selecionada"
          />
        </ng-template>
      </div>
    </label>
  </div>
