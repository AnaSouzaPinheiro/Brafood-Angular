<div class="myRecipes" [class.com-barra]="selecionando">
  <bra-perfil></bra-perfil>

  <!-- HEADER -->
  <div class="cabecalho">
    <div class="details">
      <h1 class="title">Minhas receitas</h1>
    </div>

    <div class="buttons">
      <bra-custom-button
        [label]="'Adicionar receita'"
        [type]="'add'"
        [routerLink]="'/adicionar-receita/hub'"
      ></bra-custom-button>
    </div>
  </div>

  <!-- Botão flutuante (só no celular, no lugar do botão do cabeçalho) -->
  <a class="fab-adicionar" [class.escondido]="selecionando" routerLink="/adicionar-receita/hub" aria-label="Adicionar receita">
    <i class="fa-solid fa-plus"></i>
    <span class="fab-texto">Adicionar receita</span>
  </a>

  <!-- BUSCA E FILTROS — só aparece quando há mais de 1 receita -->
  <div class="barra-container" *ngIf="!loadingRecipes && podeFiltrar">
    <bra-barra-filtros
      placeholder="Buscar nas minhas receitas..."
      modo="categoria"
      [chips]="categoriaChips"
      [total]="RecipesFiltradas.length"
      ordenarInicial="mais_novos"
      [filtrosAvancados]="false"
      (filtrosChange)="onFiltrosChange($event)"
      (buscaChange)="onBuscaChange($event)"
    ></bra-barra-filtros>
  </div>

  <!-- SKELETON enquanto as receitas carregam -->
  <bra-recipe-card-skeleton
    *ngIf="loadingRecipes"
    [count]="8"
  ></bra-recipe-card-skeleton>

  <!-- CONTENT -->
  <div class="content" *ngIf="!loadingRecipes">
    @if (RecipesFiltradas.length > 1) {
      <div class="linha-selecao">
        @if (!selecionando) {
          <button type="button" class="pilula" (click)="entrarSelecao()">
            <i class="fa-regular fa-square-check"></i> Selecionar
          </button>
        } @else {
          <button type="button" class="pilula" (click)="toggleTodas()">
            {{ todasSelecionadas ? 'Desmarcar todas' : 'Selecionar todas' }}
          </button>
        }
      </div>
    }

    <div class="cards">
      @for (recipe of myRecipesPage; track recipe.id) {
      <bra-recipe-card
        [myRecipe]="!selecionando"
        [recipe]="recipe"
        [selecionavel]="selecionando"
        [selecionado]="selecionadas.has(+recipe.id)"
        (alternarSelecao)="toggleSelecao(+recipe.id)"
        (editar)="editarReceita($event)"
        (excluir)="excluirReceita($event)"
      ></bra-recipe-card>
      }
    </div>

    <div class="pages" *ngIf="RecipesFiltradas.length > fim">
      <bra-custom-button
        [label]="'Ver mais receitas'"
        [type]="'comment'"
        (click)="verMais()"
      ></bra-custom-button>
    </div>
  </div>
</div>

<!-- Barra de ações da seleção em massa -->
@if (selecionando) {
  <div class="barra-selecao" role="toolbar" aria-label="Ações nas receitas selecionadas">
    <button type="button" class="cancelar" (click)="sairSelecao()" aria-label="Cancelar seleção" title="Cancelar seleção">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <span class="contagem">
      {{ selecionadas.size }} {{ selecionadas.size === 1 ? 'selecionada' : 'selecionadas' }}
    </span>
    <div class="acoes-massa">
      <button type="button" class="perigo" [disabled]="!selecionadas.size" (click)="excluirSelecionadas()">
        <i class="fa-solid fa-trash"></i> <span>Excluir</span>
      </button>
    </div>
  </div>
}
