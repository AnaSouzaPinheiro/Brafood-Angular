<div class="myRecipes">
  <bra-perfil></bra-perfil>

  <!-- HEADER -->
  <div class="cabecalho">
    <div class="details">
      <h1 class="title">Minhas receitas</h1>
      <span class="qtdReceitas"
        >{{ RecipesFiltradas.length }} receitas enviadas</span
      >
    </div>

    <div class="buttons">
      <bra-custom-button
        [label]="'Adicionar receita'"
        [type]="'add'"
        [routerLink]="'/adicionar-receita/hub'"
      ></bra-custom-button>
    </div>
  </div>

  <!-- FILTROS — só aparece quando há mais de 1 receita -->
  <div class="filter-container" *ngIf="podeFiltrar">
    <bra-filter-panel
      mode="categoria"
      [dropdownDinamico]="categoriaItems"
      [labelDinamico]="'Categorias:'"
      [totalReceitas]="RecipesFiltradas.length"
      [showContadorMobile]="false"
      (filtrosChange)="onFiltrosChange($event)"
    ></bra-filter-panel>
  </div>

  <!-- CONTENT -->
  <div class="content">
    <div class="cards">
      @for (recipe of myRecipesPage; track recipe.id) {
      <bra-recipe-card
        [myRecipe]="true"
        [recipe]="recipe"
        (editar)="editarReceita($event)"
        (excluir)="excluirReceita($event)"
      ></bra-recipe-card>
      }
    </div>

    <!-- PAGINATION -->
    <div class="pages" *ngIf="RecipesFiltradas.length > 8">
      <span (click)="prevPage()" class="setas">&lt;</span>

      @for (page of pagesArray; track page) {
      <span
        (click)="goToPage(page)"
        class="numbers"
        [class.active]="page === currentPage"
        >{{ page }}</span
      >
      }

      <span (click)="nextPage()" class="setas">&gt;</span>
    </div>
  </div>
</div>
