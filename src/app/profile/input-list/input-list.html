<div class="input-list-wrapper">
  <div
    class="item-wrapper"
    *ngFor="let item of items; let i = index; trackBy: trackByIndex"
  >
    <label class="input-list-label">{{ label }}</label>

    <!-- Input do título (opcional) -->
    <bra-input
      inType="input"
      [label]="''"
      [placeholder]="titlePlaceholder"
      [value]="titleControls[i].value"
      (valueChange)="updateTitle(i, $event)"
      [autocomplete]="'item-title-'+i"
    ></bra-input>

    <!-- Subinputs -->
    <div
      class="input-row"
      [class.passo]="ehPasso"
      *ngFor="let sub of item.subitems; let j = index; trackBy: trackByIndex"
    >
      <span class="numero" *ngIf="ehPasso" aria-hidden="true"><span class="palavra">Passo </span>{{ j + 1 }}</span>

      <bra-input
        [inType]="inType"
        [autoGrow]="ehPasso"
        [label]="''"
        [placeholder]="subitemPlaceholder"
        [value]="subitemControls[i][j].value"
        (valueChange)="updateSubitem(i, j, $event)"
        [autocomplete]="'item-sub-'+i+'-'+j"
      ></bra-input>

      <button
        class="remover"
        *ngIf="item.subitems.length > 1"
        type="button"
        (click)="removeSubitem(i, j)"
        [attr.aria-label]="ehPasso ? 'Remover passo ' + (j + 1) : 'Remover ingrediente'"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <button
      class="adicionar-sub"
      type="button"
      *ngIf="item.subitems.length < maxItems"
      (click)="addSubitem(i)"
    >
      <i class="fa-solid fa-plus"></i>
      {{ ehPasso ? 'Adicionar passo' : 'Adicionar ingrediente' }}
    </button>

    <bra-custom-button
      [type]="'comment'"
      [label]="removeLabel"
      class="remover-item"
      (clicked)="removeItem(i)"
    ></bra-custom-button>
  </div>

  <bra-custom-button
    [type]="'comment'"
    [label]="addLabel"
    class="adicionar-item"
    (clicked)="addItem()"
  ></bra-custom-button>

  <span class="field-error" *ngIf="isInvalid" role="alert">
    <i class="fa-solid fa-circle-exclamation"></i>
    {{ errorMessage }}
  </span>
</div>
