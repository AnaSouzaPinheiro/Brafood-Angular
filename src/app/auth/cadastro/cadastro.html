<div class="container">
  <img src="assets/imagens/icones/BraFoodLogo.png" alt="" class="logo" />

  <div class="modal">
    <span class="back">< Voltar</span>

    <div class="infos">
      <h1 class="title">Crie sua conta</h1>
      <p class="description">Cadastre-se para publicar suas receitas!</p>
    </div>

    <div class="inputsCadastro">
      <bra-input-acesso [type]="'nome'"></bra-input-acesso
      ><bra-input-acesso [type]="'email'"></bra-input-acesso>
      <bra-input-acesso [type]="'senha'"></bra-input-acesso
      ><bra-input-acesso [type]="'confirmarSenha'"></bra-input-acesso>
    </div>
    <ul class="rules">
      Sua senha deve atender aos seguintes requisitos
      <li>8 caracteres mínimo</li>
      <li>1 dígito</li>
      <li>1 minúscula</li>
      <li>1 maiúscula</li>
      <li>1 carácter especial (ex : ! &#64; # $)</li>
    </ul>

    <bra-custom-button label="Cadastrar"></bra-custom-button>

    <p class="cadastre">
      Já tem uma conta? <span class="register" [routerLink]="'/login'">Faça o login.</span>
    </p>
  </div>
</div>
