<div class="inputs">
  <!--<img [src]="icon" width="25" class="inputIcon" />-->
  <i [class]="icon" class="inputIcon"></i>

  <input
    [id]="inputId"
    [name]="name"
    [type]="htmlType"
    [placeholder]="placeholder"
    class="input-text"
    [value]="value"
    (input)="inputChanged($event)"
    [attr.autocomplete]="autocomplete"
  />
</div>
