<div class="inputs">
  <i [class]="icon" class="inputIcon"></i>

  <input
    [id]="inputId"
    [name]="name"
    [type]="htmlType"
    [placeholder]="placeholder"
    class="input-text"
    [class.input-error]="isInvalid"
    [value]="value"
    (input)="inputChanged($event)"
    (blur)="onBlur()"
    [attr.autocomplete]="autocomplete"
  />

  <span class="field-error" *ngIf="isInvalid" role="alert">
    <i class="fa-solid fa-circle-exclamation"></i>
    {{ errorMessage }}
  </span>
</div>
