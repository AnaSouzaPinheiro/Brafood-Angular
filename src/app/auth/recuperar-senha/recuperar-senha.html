<div class="container">
  <a [routerLink]="'/home'">
    <img
      class="logo"
      src="assets/imagens/icones/BraFoodLogoR.png"
      alt="Logo BraFood"
    />
  </a>

  <div class="modal">
    <span class="back" (click)="voltar()">< Voltar</span>

    <div class="infos">
      <h1 class="title">Recuperar senha</h1>
      <p class="description">
        Informe seu e-mail e enviaremos instruções para redefinir sua senha.
      </p>
    </div>

    <form (ngSubmit)="enviar()">
      <bra-input-acesso
        [type]="'email'"
        [(ngModel)]="email"
        name="emailRecuperacao"
        autocomplete="email"
      ></bra-input-acesso>

      <bra-alert type="error" *ngIf="erro">{{ erro }}</bra-alert>
      <bra-alert type="success" *ngIf="sucesso">
        {{ sucesso }} Confira também a caixa de spam.
      </bra-alert>

      <bra-custom-button label="Enviar instruções"></bra-custom-button>
    </form>
  </div>
</div>
