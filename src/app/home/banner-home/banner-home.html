<a [routerLink]="recipe.url" class="banner-container-link">
  <div class="banner-container">
    <img data-fade [src]="recipe.img | mediaUrl" alt="Banner da Receita" fetchpriority="high" />

    <bra-recipe-resume
      class="banner-resume"
      [resume]="recipe.resume"
      [type]="'banner'"
    >
    </bra-recipe-resume>
  </div>
</a>
