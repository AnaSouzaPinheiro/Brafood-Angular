<div class="salvar-em" role="dialog" aria-label="Salvar receita em">
  <div class="topo">
    <strong>Salvar em…</strong>
    <button type="button" class="fechar" (click)="fechar.emit()" aria-label="Fechar">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  @if (carregando) {
    <p class="carregando">Carregando…</p>
  } @else {
    <ul class="lista">
      <li>
        <button type="button" class="opcao" [class.marcado]="favorito" (click)="toggleFavoritos()" [disabled]="ocupado">
          <span class="icone fav"><i class="fa-solid fa-heart"></i></span>
          <span class="nome">Favoritos</span>
          <i class="check fa-solid" [class.fa-circle-check]="favorito" [class.fa-circle]="!favorito"></i>
        </button>
      </li>

      @for (q of quadros; track q.id) {
        <li>
          <button
            type="button"
            class="opcao"
            [class.marcado]="selecionados.has(q.id)"
            (click)="toggleQuadro(q)"
            [disabled]="ocupado"
          >
            <span class="icone"><i class="fa-solid fa-table-cells-large"></i></span>
            <span class="nome">{{ q.nome }}</span>
            <i
              class="check fa-solid"
              [class.fa-circle-check]="selecionados.has(q.id)"
              [class.fa-circle]="!selecionados.has(q.id)"
            ></i>
          </button>
        </li>
      }
    </ul>

    @if (!criando) {
      <button type="button" class="novo" (click)="criando = true">
        <i class="fa-solid fa-plus"></i> Criar novo quadro
      </button>
    } @else {
      <form class="form-novo" (ngSubmit)="criarQuadro()">
        <input
          name="nome"
          [(ngModel)]="novoNome"
          maxlength="60"
          placeholder="Nome do quadro"
          aria-label="Nome do novo quadro"
          autofocus
        />
        <button type="submit" [disabled]="!novoNome.trim() || ocupado">Criar</button>
      </form>
    }

    <!-- Status: só para receitas salvas -->
    @if (favorito) {
      <div class="extras">
        <div class="status">
          <button
            type="button"
            [class.ativo]="status === 'quero_fazer'"
            (click)="escolherStatus('quero_fazer')"
            [disabled]="ocupado"
          >
            <i class="fa-regular fa-bookmark"></i> Quero fazer
          </button>
          <button
            type="button"
            [class.ativo]="status === 'ja_fiz'"
            (click)="escolherStatus('ja_fiz')"
            [disabled]="ocupado"
          >
            <i class="fa-solid fa-check"></i> Já fiz
          </button>
        </div>
      </div>
    }
  }
</div>
