<div class="infos-recipe">
  <div class="main-info">
    <bra-recipe-images [images]="recipe"></bra-recipe-images>
    <bra-info-recipe *ngIf="recipe" [recipe]="recipe"></bra-info-recipe>
  </div>

  <div class="receita">
    <div class="container">
      <div class="ingredientes">
        <h1 class="title">Ingredientes</h1>

        <div *ngFor="let ing of recipe?.ingredientes">
          <ul>
            <span class="temaIng">{{ ing.titulo }}</span>
            <li *ngFor="let item of ing.itens">{{ item }}</li>
          </ul>
        </div>
      </div>

      <div class="list">
        <div class="autor">
          <img class="bra-user-icon" [src]="recipe?.foto_perfil" />
          <div class="data">
            <span class="person"> Por {{ recipe?.autor }} </span>
            <span class="date">Publicado em: {{ recipe?.data_criacao }} </span>
          </div>
        </div>
        <div class="whatsApp">
          Ainda precisa comprar os ingredientes?

          <span>Mande a lista por WhatsApp:</span>
          <a class="zap" [href]="urlWhatsApp" target="_blank">
            <i class="fa-brands fa-whatsapp"></i>Enviar
            lista
          </a>
        </div>
      </div>
    </div>
    <section class="preparo">
      <h1 class="title">Modo de Preparo</h1>

      <div *ngFor="let etapa of recipe?.etapas">
        <h2 class="topic-title">{{ etapa.ordem }}. {{ etapa.titulo }}</h2>
        <ul class="ul-preparo">
          <li *ngFor="let desc of etapa.descricoes">{{ desc.descricao }}</li>
        </ul>
      </div>
    </section>

    <section class="commmets" id="comentarios">
      <div class="container com">
        <h1 class="title sec">Comentários</h1>

        <bra-input
          inType="textarea"
          placeholder="Nos conte o que achou dessa receita..."
          [(ngModel)]="novoComentario"
        ></bra-input>

        <bra-custom-button
          label="Comentar"
          (click)="comentar()"
        ></bra-custom-button>

        <div class="c">
          <bra-comment
            *ngFor="let comment of comentarios | slice:0:visibleCommentsCount"
            [comment]="comment"
            (sendReply)="enviarComentario($event)"
          ></bra-comment>
        </div>

        <bra-custom-button
          *ngIf="comentarios.length > visibleCommentsCount"
          class="seeReplies"
          type="comment"
          label="Ver mais comentários"
          (click)="verMaisComentarios()"
        >
        </bra-custom-button>
      </div>
    </section>
  </div>
</div>
