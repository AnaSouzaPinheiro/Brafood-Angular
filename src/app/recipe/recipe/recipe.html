<div class="infos-recipe">
  <div class="main-info">
    <bra-recipe-images [images]="recipe"></bra-recipe-images>
    <bra-info-recipe [recipe]="recipe"></bra-info-recipe>
  </div>

  <div class="receita">
    <div class="container">
      <div class="ingredientes">
        <h1 class="title">Ingredientes</h1>

        <div *ngFor="let ing of recipe?.ingredientes">
          <ul>
            <span class="temaIng">{{ ing.titulo }}</span>
            <li *ngFor="let item of ing.itens">{{ item }}</li>
          </ul>
        </div>
      </div>

      <div class="list">
        <div class="autor">
          <img class="bra-user-icon" [src]="recipe?.foto_perfil">
          <div class="data">
            <span class="person"> Por {{ recipe?.autor }} </span>
            <span class="date">Publicado em: {{ recipe?.data_criacao }} </span>
          </div>
        </div>
        <div class="whatsApp">
          Ainda precisa comprar os ingredientes?

          <span>Mande a lista por WhatsApp:</span>
          <button class="zap">
            <img src="assets/imagens/icones/whatsapp (2).png" alt="" />Enviar
            lista
          </button>
        </div>
      </div>
    </div>
    <section class="preparo">
      <h1 class="title">Modo de Preparo</h1>

      <div *ngFor="let etapa of recipe?.etapas">
        <h2 class="topic-title">{{ etapa.ordem }}. {{ etapa.titulo }}</h2>
        <ul class="ul-preparo">
          <li *ngFor="let desc of etapa.descricoes">
            {{ desc.descricao }}
          </li>
        </ul>
      </div>
    </section>
  </div>
</div>
