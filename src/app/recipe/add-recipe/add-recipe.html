<div class="container">
  <bra-perfil></bra-perfil>

  <form [formGroup]="form" class="adding" (ngSubmit)="salvar()">
    <h1 class="title">Adicionando minha receita</h1>

    <!-- Imagens -->
    <h3>Anexe até 3 imagens da receita:</h3>
    <bra-input-images
      (imagesChange)="onImagensSelecionadas($event)"
    ></bra-input-images>
    <span class="field-error imagem-error" *ngIf="erroImagem" role="alert">
      <i class="fa-solid fa-circle-exclamation"></i> {{ erroImagem }}
    </span>

    <div class="inputs">
      <div class="input-box">
        <bra-input
          [inType]="'input'"
          name="tituloReceita"
          formControlName="titulo"
          autocomplete="recipe-title"
          [label]="'Título da receita*'"
          [placeholder]="'Pé de moleque'"
          [errorMessages]="{ required: 'Dê um título para a receita.', minlength: 'O título deve ter pelo menos 3 caracteres.' }"
        ></bra-input>
      </div>

      <div class="input-box">
        <bra-input
          [label]="'Resumo da receita*'"
          [inType]="'textarea'"
          [placeholder]="'Receita tradicional deliciosa e fácil de preparar.'"
          formControlName="resumo"
          name="resumoReceita"
          autocomplete="recipe-description"
          [errorMessages]="{ required: 'Escreva um resumo da receita.', minlength: 'Escreva pelo menos 10 caracteres para o resumo.' }"
        ></bra-input>
      </div>

      <!-- Categorias -->
      <div class="input-box">
        <bra-dropdown
          [label]="'Categorias*'"
          [options]="categoriasDropdown"
          [multiSelect]="true"
          [selected]="categoriasSelecionadas"
          (optionSelected)="onCategoriaSelecionada($event)"
          [forceValidate]="tentouEnviar"
          requiredMessage="Selecione pelo menos uma categoria."
        ></bra-dropdown>
      </div>

      <!-- Subcategorias dinâmicas -->
      <div class="input-box" *ngFor="let cat of categoriasSelecionadas">
        <bra-dropdown
          [label]="'Subcategoria de ' + cat.label + '*'"
          [options]="subcategoriasPorCategoria[cat.value] || []"
          [multiSelect]="false"
          [selected]="subcategoriasSelecionadas[cat.value] || []"
          (optionSelected)="onSubcategoriaSelecionada(cat.value, $event)"
          [forceValidate]="tentouEnviar"
          requiredMessage="Selecione a subcategoria."
        ></bra-dropdown>
      </div>
    </div>

    <!-- Dificuldade / Tempo / Porções -->
    <div class="some">
      <div class="input-box">
        <bra-input
          [label]="'Dificuldade*'"
          [inType]="'input'"
          [placeholder]="'1, 2 ou 3'"
          formControlName="dificuldade"
          name="dificuldadeReceita"
          autocomplete="off"
          [errorMessages]="{ required: 'Informe a dificuldade.', min: 'Mínimo 1.', max: 'Máximo 3.' }"
        ></bra-input>
      </div>

      <div class="time">
        <label>Tempo de preparo*</label>
        <div class="input-box">
          <bra-input
            [label]="''"
            [inType]="'input'"
            [placeholder]="'hora(s)'"
            formControlName="tempo_hora"
            name="hrTempoReceita"
            autocomplete="off"
            [errorMessages]="{ required: 'Informe as horas.' }"
          ></bra-input>
          :
          <bra-input
            [label]="''"
            [inType]="'input'"
            [placeholder]="'minuto(s)'"
            formControlName="tempo_min"
            name="minTempoReceita"
            autocomplete="off"
            [errorMessages]="{ required: 'Informe os minutos.' }"
          ></bra-input>
        </div>
      </div>

      <div class="porcoes">
        <label>Porções*</label>
        <div class="input-box">
          <bra-input
            [label]="''"
            [inType]="'input'"
            [placeholder]="''"
            formControlName="porcoes"
            name="qtdPorcoesReceita"
            autocomplete="off"
            [errorMessages]="{ required: 'Informe a quantidade.' }"
          ></bra-input>
          <bra-dropdown
            [label]="''"
            [multiSelect]="false"
            [selected]="porcaoSelecionada"
            [options]="porcoesDropdown"
            (optionSelected)="onPorcaoSelecionada($event)"
            [forceValidate]="tentouEnviar"
            requiredMessage="Selecione o tipo de porção."
          ></bra-dropdown>
        </div>
      </div>
    </div>

    <!-- Ingredientes -->
    <h2>Ingredientes*</h2>
    <div class="inputs">
      <div class="input-box">
        <bra-input-list
          [label]="'Título do item'"
          [titlePlaceholder]="'Ex: Calda'"
          [subitemPlaceholder]="'Ex: 1 xícara de açúcar'"
          [items]="ingredientesComoItems"
          (listChange)="atualizarIngredientes($event)"
          [removeLabel]="'Remover item'"
          [addLabel]="'Adicionar mais um item'"
          [forceValidate]="tentouEnviar"
          errorMessage="Adicione pelo menos um ingrediente."
        ></bra-input-list>
      </div>
    </div>

    <!-- Modo de preparo -->
    <h2>Modo de preparo*</h2>
    <div class="inputs">
      <div class="input-box">
        <bra-input-list
          [label]="'Etapa'"
          [titlePlaceholder]="'Ex: Preparando a calda'"
          [subitemPlaceholder]="'Ex: Misture o açúcar com água e leve ao fogo...'"
          [inType]="'textarea'"
          [items]="etapasComoItems"
          (listChange)="atualizarEtapas($event)"
          [removeLabel]="'Remover etapa'"
          [addLabel]="'Adicionar mais uma etapa'"
          [forceValidate]="tentouEnviar"
          errorMessage="Descreva pelo menos uma etapa do modo de preparo."
        ></bra-input-list>
      </div>
    </div>

    <bra-custom-button
      class="salvar"
      [type]="'add'"
      [label]="'Enviar receita'"
      (clicked)="salvar()"
    ></bra-custom-button>
  </form>
</div>
