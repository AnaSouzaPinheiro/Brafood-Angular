<div class="receita-card" *ngIf="mappedRecipe" [routerLink]="mappedRecipe.url">
  <div class="infos">
    <h2 class="categoria">
      <ng-container *ngIf="mappedRecipe.subcategory; else categoriaPadrao">
        {{ mappedRecipe.subcategory }}
      </ng-container>
      <ng-template #categoriaPadrao> {{ mappedRecipe.category }} </ng-template>
    </h2>

    <ng-container *ngIf="mappedRecipe.img && !imgBroken; else imgFallback">
      <img
        [src]="mappedRecipe.img"
        alt=""
        class="img-receita"
        (error)="imgBroken = true"
      />
    </ng-container>
    <ng-template #imgFallback>
      <div class="img-placeholder">
        <img src="assets/imagens/icones/foto (1).png" alt="" />
      </div>
    </ng-template>

    <span
      [hidden]="myRecipe === false"
      class="icons"
      id="edit"
      (click)="onEditar($event)"
    >
      <img src="assets/imagens/icones/arquivo.png" alt="" />
    </span>
    <span
      [hidden]="myRecipe === false"
      class="icons"
      id="trash"
      (click)="onExcluir($event)"
    >
      <img src="assets/imagens/icones/lixo.png" alt="" />
    </span>
  </div>

  <bra-recipe-resume
    class="resume"
    [resume]="mappedRecipe.resume"
    [type]="'card'"
  ></bra-recipe-resume>
</div>
