<div class="comment">
  <div class="reply-to" *ngIf="isReply() && comment.nome_pai">
    <i class="fa-solid fa-reply"></i>
    em resposta a
    <span class="reply-to-name">{{ '@' + comment.nome_pai }}</span>
  </div>

  <div class="comment-body">
    <div class="person">
      <bra-user-icon
        [user]="{ id: comment.id_usuario, nome: comment.nome_usuario, foto_perfil: comment.foto_perfil }"
      ></bra-user-icon>

      <span class="name">{{ comment.nome_usuario }}</span>
    </div>

    <div class="content">
      <div class="comment-meta">
        <span class="data">
          {{ comment.data_criacao | date: "dd/MM/yy 'às' HH'h'mm" }}
        </span>
        <div class="comment-nota" *ngIf="comment.nota">
          <ng-container *ngFor="let i of [1,2,3,4,5]">
            <i
              class="fa-star comment-star"
              [class.fa-solid]="i <= (comment.nota || 0)"
              [class.fa-regular]="i > (comment.nota || 0)"
            ></i>
          </ng-container>
        </div>
      </div>

      <p class="text">{{ comment.texto }}</p>

      <div class="replies">
        <span class="response" (click)="responder()">Responder</span>

        <span
          class="seeReplies"
          *ngIf="(comment.replies?.length || 0) && !showReplies"
          (click)="toggleReplies()"
        >
          Ver {{ comment.replies?.length || 0 }} respostas
        </span>

        <span
          class="excluir"
          *ngIf="podeExcluir"
          [class.disabled]="excluindo"
          (click)="excluir()"
        >
          <i class="fa-regular fa-trash-can"></i>
          {{ excluindo ? 'Excluindo...' : '' }}
        </span>
      </div>
    </div>
  </div>

  <div class="replying" *ngIf="replying">
    <div class="seta">
      <i class="fa-solid fa-arrow-turn-up fa-rotate-90"></i>
    </div>

    <div class="writing">
      <div class="reply-input-wrapper">
        <textarea
          class="reply-textarea"
          [class.reply-error]="respostaInvalida"
          placeholder="Escreva sua resposta..."
          [(ngModel)]="textoResposta"
          (ngModelChange)="tentouEnviarResposta = false"
          rows="3"
        ></textarea>

        <span class="field-error" *ngIf="respostaInvalida" role="alert">
          <i class="fa-solid fa-circle-exclamation"></i>
          {{ erroResposta }}
        </span>
      </div>

      <div class="reply-actions">
        <button
          class="cancelar"
          [disabled]="enviandoResposta"
          (click)="cancelar()"
        >
          Cancelar
        </button>
        <bra-custom-button
          class="send"
          [label]="enviandoResposta ? 'Enviando...' : 'Responder'"
          [disabled]="enviandoResposta"
          (clicked)="enviar()"
        ></bra-custom-button>
      </div>
    </div>
  </div>
</div>

<!-- REPLIES -->
<div class="replies-list" *ngIf="showReplies">
  <bra-comment
    *ngFor="let reply of (comment.replies || []) | slice:0:visibleRepliesCount"
    [comment]="reply"
    (sendReply)="sendReply.emit($event)"
    (deleteComment)="deleteComment.emit($event)"
  ></bra-comment>

  <bra-custom-button
    *ngIf="(comment.replies?.length || 0) > visibleRepliesCount"
    class="seeReplies"
    type="comment"
    label="Ver mais respostas"
    (clicked)="verMaisRespostas()"
  ></bra-custom-button>
</div>
