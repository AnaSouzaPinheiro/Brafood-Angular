@if (imageList.length > 2) {
  <div class="all-container">
    <div class="oneHalf">
      <img class="one" (click)="openLightbox(0)" [src]="imageList[0] | mediaUrl" alt="" />
    </div>
    
    <div class="twoHalf">
      <img class="two" (click)="openLightbox(1)" [src]="imageList[1] | mediaUrl" alt="" />
      <img class="three" (click)="openLightbox(2)" [src]="imageList[2] | mediaUrl" alt="" />
    </div>
  </div>
} @else if (imageList.length == 2) {
  <div class="two-container">
    <div class="oneHalf">
      <img class="one" (click)="openLightbox(0)" [src]="imageList[0] | mediaUrl" alt="" />
    </div>
    
    <div class="twoHalf">
      <img class="two" (click)="openLightbox(1)" [src]="imageList[1] | mediaUrl" alt="" />
    </div>
  </div>
} @else {
  <div class="one-container">
    <div class="oneHalf">
      <img class="one" (click)="openLightbox(0)" [src]="imageList[0] | mediaUrl" alt="" />
    </div>
  </div>
}

<!-- Lightbox -->
<div class="lightbox" *ngIf="isLightboxOpen">
  <div class="lightbox-content">
    <button class="close" (click)="closeLightbox()">✖</button>

    <div class="all">

        <button class="prev" (click)="prevImage()"><</button>
        
        <img [src]="imageList[currentIndex()] | mediaUrl" class="lightbox-image" />
        
        <button class="next" (click)="nextImage()">></button>
    </div>
  </div>
</div>
