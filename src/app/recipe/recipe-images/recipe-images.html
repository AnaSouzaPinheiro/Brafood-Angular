@if (imageList.length > 2) {
<div class="all-container">
  <div class="oneHalf">
    <img data-fade
      class="one"
      (click)="openLightbox(0)"
      [src]="imageList[0] | mediaUrl"
      alt=""
      loading="eager"
    />
  </div>

  <div class="twoHalf">
    <img data-fade
      class="two"
      (click)="openLightbox(1)"
      [src]="imageList[1] | mediaUrl"
      alt=""
      loading="eager"
    />

    <div class="third-image">
      <img data-fade
        class="three"
        (click)="openLightbox(2)"
        [src]="imageList[2] | mediaUrl"
        alt=""
      />

      @if (imageList.length > 3) {
      <button class="more-images" type="button" (click)="openLightbox(2)">
        +{{ imageList.length - 3 }}
      </button>
      }
    </div>
  </div>
</div>
} @else if (imageList.length == 2) {
<div class="two-container">
  <div class="oneHalf">
    <img data-fade
      class="one"
      (click)="openLightbox(0)"
      [src]="imageList[0] | mediaUrl"
      alt=""
      loading="eager"
    />
  </div>

  <div class="twoHalf">
    <img data-fade
      class="two"
      (click)="openLightbox(1)"
      [src]="imageList[1] | mediaUrl"
      alt=""
      loading="eager"
    />
  </div>
</div>
} @else {
<div class="one-container">
  <div class="oneHalf">
    <img data-fade
      class="one"
      (click)="openLightbox(0)"
      [src]="imageList[0] | mediaUrl"
      alt=""
      loading="eager"
    />
  </div>
</div>
}

<!-- Lightbox -->
<div class="lightbox" *ngIf="isLightboxOpen" (click)="closeLightbox()">
  <button class="close" type="button" (click)="closeLightbox()" aria-label="Fechar">
    <i class="fa-solid fa-xmark"></i>
  </button>

  <div class="lightbox-content" (click)="$event.stopPropagation()">
    <div class="lightbox-viewer">
      @if (imageList.length > 1) {
        <button class="prev seta-lateral" type="button" (click)="prevImage()" aria-label="Imagem anterior">
          <i class="fa-solid fa-caret-left"></i>
        </button>
      }

      <img data-fade
        [src]="imageList[currentIndex()] | mediaUrl"
        class="lightbox-image"
        alt=""
        loading="eager"
      />

      @if (imageList.length > 1) {
        <button class="next seta-lateral" type="button" (click)="nextImage()" aria-label="Próxima imagem">
          <i class="fa-solid fa-caret-right"></i>
        </button>
      }
    </div>

    <!-- Miniaturas (só com mais de uma imagem). No celular, as setas
         ficam aqui, dos lados das miniaturas. -->
    @if (imageList.length > 1) {
      <div class="rodape-galeria">
        <button class="prev seta-rodape" type="button" (click)="prevImage()" aria-label="Imagem anterior">
          <i class="fa-solid fa-caret-left"></i>
        </button>

        <div class="thumbnail-carousel">
          @for (image of imageList; track $index) {
          <button
            class="thumbnail"
            type="button"
            [class.active]="currentIndex() === $index"
            (click)="openLightbox($index)"
          >
            <img data-fade [src]="image | mediaUrl" alt="" />
          </button>
          }
        </div>

        <button class="next seta-rodape" type="button" (click)="nextImage()" aria-label="Próxima imagem">
          <i class="fa-solid fa-caret-right"></i>
        </button>
      </div>
    }
  </div>
</div>
