<div class="admin-painel">
  <div class="admin-header">
    <h1>Painel Administrativo</h1>
    <p class="subtitle">
      Gerencie categorias, subcategorias e seções da home do BraFood
    </p>
  </div>

  <!-- Tabs -->
  <nav class="tabs" aria-label="Seções do painel">
    <a
      class="tab-btn"
      routerLink="/admin/categorias"
      [class.active]="tab === 'categorias'"
      [attr.aria-current]="tab === 'categorias' ? 'page' : null"
    >
      Categorias
    </a>
    <a
      class="tab-btn"
      routerLink="/admin/subcategorias"
      [class.active]="tab === 'subcategorias'"
      [attr.aria-current]="tab === 'subcategorias' ? 'page' : null"
    >
      Subcategorias
    </a>
    <a
      class="tab-btn"
      routerLink="/admin/secoes"
      [class.active]="tab === 'secoes'"
      [attr.aria-current]="tab === 'secoes' ? 'page' : null"
    >
      Seções da Home
    </a>
    <a
      class="tab-btn destaque-tab"
      routerLink="/admin/destaque"
      [class.active]="tab === 'destaque'"
      [attr.aria-current]="tab === 'destaque' ? 'page' : null"
    >
      ✦ Destaque da Semana
    </a>
  </nav>

  @switch (tab) {
    @case ('categorias') { <bra-admin-categorias /> }
    @case ('subcategorias') { <bra-admin-subcategorias /> }
    @case ('secoes') { <bra-admin-secoes /> }
    @case ('destaque') { <bra-admin-destaque /> }
  }
</div>
