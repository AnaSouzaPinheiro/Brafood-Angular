<div class="img-container">
  <img [src]="categoria?.fundo" [alt]="categoria?.nome" class="background" />
  <h1 class="title">{{ categoria?.nome }}</h1>
</div>

<div class="filter-container">
  <bra-filter-panel
    mode="subcategoria"
    [dropdownDinamico]="subcategoriaItems"
    [labelDinamico]="'Subcategorias:'"
    [totalReceitas]="RecipesFiltradas.length"
    [showContadorMobile]="true"
    (filtrosChange)="onFiltrosChange($event)"
  ></bra-filter-panel>

  <span class="qtdReceitas">
    {{ RecipesFiltradas.length || 0 }} receitas encontradas
  </span>
</div>

<div class="content" *ngIf="categoria">
  <div class="cards">
    @for (recipe of RecipesPage; track $index) {
    <bra-recipe-card
      [recipe]="recipe"
      [selectedSubcategories]="filtros.subcategorias"
    ></bra-recipe-card>
    }
  </div>
  <div class="pages">
    <bra-custom-button
      [hidden]="RecipesFiltradas.length < end"
      [label]="'Ver mais receitas'"
      [type]="'comment'"
      (click)="verMais()"
    ></bra-custom-button>
  </div>
</div>
