<div class="img-container">
  <img [src]="categoria?.fundo" [alt]="categoria?.nome" class="background" />
  <h1 class="title">{{ categoria?.nome }}</h1>
</div>

<div class="filter-container">
  <bra-filter-panel
    *ngIf="Recipes.length > 0"
    mode="subcategoria"
    [dropdownDinamico]="subcategoriaItems"
    [labelDinamico]="'Subcategorias:'"
    [totalReceitas]="RecipesFiltradas.length"
    [showContadorMobile]="true"
    (filtrosChange)="onFiltrosChange($event)"
  ></bra-filter-panel>

  <span class="qtdReceitas">
    {{ RecipesFiltradas.length || 0 }} receitas encontradas
  </span>
</div>

<div class="content" *ngIf="categoria && RecipesFiltradas.length > 0">
  <div class="cards">
    @for (recipe of RecipesPage; track recipe.id) {
    <bra-recipe-card
      [recipe]="recipe"
      [selectedSubcategories]="filtros.subcategorias"
    ></bra-recipe-card>
    }
  </div>
  <div class="pages">
    <bra-custom-button
      [hidden]="RecipesFiltradas.length < end"
      [label]="'Ver mais receitas'"
      [type]="'comment'"
      (click)="verMais()"
    ></bra-custom-button>
  </div>
</div>

<div class="empty-state" *ngIf="categoria && RecipesFiltradas.length === 0">
  <img [src]="categoria.icone" [alt]="categoria.nome" class="empty-icon" />

  <h2>
    Ainda não temos receitas nessa categoria
    <i class="fa-solid fa-heart-crack"></i>
  </h2>

  <p>
    Seja a primeira pessoa a compartilhar uma receita de {{
    categoria.nome.toLowerCase() }}!
  </p>

  <bra-custom-button
    [label]="'Adicionar receita'"
    [type]="'add'"
    (click)="adicionarReceita()"
  ></bra-custom-button>
</div>
