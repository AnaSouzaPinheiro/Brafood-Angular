<div class="img-container">
  <img [src]="categoria?.fundo" [alt]="categoria?.nome" class="background" />
  <h1 class="title">{{ categoria?.nome }}</h1>
</div>

<div class="filter-container">
  <div class="filters">
    <bra-filter-dropdown
      [optionsDropwdown]="optionsDropwdown"
      type="single"
      (changeFilter)="filtrarPorOrdem($event)"
    ></bra-filter-dropdown>

    <bra-filter-dropdown
      [optionsDropwdown]="optionsDropwdown2"
      type="multi"
      (changeMulti)="filtrarPorSubcategoria($event)"
    ></bra-filter-dropdown>

    <bra-custom-button
      [label]="'Limpar filtros'"
      [type]="'filter'"
      (click)="limparFiltros()"
    ></bra-custom-button>
  </div>

  <span class="qtdReceitas">
    {{ Recipes?.length || 0 }} receitas encontradas
  </span>
</div>

<div class="content" *ngIf="categoria">
  <div class="cards">
    @for (recipe of RecipesPage; track $index) {
    <bra-recipe-card
      [recipe]="recipe"
      [selectedSubcategories]="filtros.subcategorias"
    ></bra-recipe-card>
    }
  </div>
