<div class="img-container">
  <img [src]="categoria?.fundo" [alt]="categoria?.nome" class="background" />
  <h1 class="title">{{ categoria?.nome }}</h1>
</div>

<div class="filter-container">
  <div class="filters">
    <bra-filter-dropdown
      [optionsDropwdown]="optionsDropwdown"
    ></bra-filter-dropdown>
    <bra-filter-dropdown
      [optionsDropwdown]="optionsDropwdown2"
    ></bra-filter-dropdown>
    <bra-custom-button
      [label]="'Limpar filtros'"
      [type]="'filter'"
    ></bra-custom-button>
  </div>

  <span class="qtdReceitas">
    {{ Recipes?.length || 0 }} receitas encontradas
  </span>
</div>

<div class="content" *ngIf="categoria">
  <div class="cards">
    @for (recipe of RecipesPage; track $index) {
    <bra-recipe-card [recipe]="recipe"></bra-recipe-card>
    }
  </div>
  <div class="pages">
    <span (click)="prevPage()" class="setas"><</span>

    @for (page of pagesArray; track page) {
    <span
      (click)="goToPage(page)"
      class="numbers"
      [class.active]="page === currentPage"
    >
      {{ page }}
    </span>
    }

    <span (click)="nextPage()" class="setas">></span>
  </div>
</div>
